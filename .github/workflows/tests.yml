name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (pure-Python core, no QGIS needed)
        run: python -m unittest discover -s pcp_eia_pollution_modeling/tests -t .
